<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PetShop</title>

    <style>

         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e8f8f5;
            color: #164e4a;
            text-align: center;
        }

        header {
            background-color: #0f766e;
            color: white;
            padding: 20px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .container {
            padding: 60px 20px;
        }

        .content {
            background-color: white;
            width: 90%;
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
        }

        h1 {
            color: #0f766e;
            font-size: 35px;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 17px;
            margin-bottom: 25px;
        }

        .imagem {
            width: 180px;
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;

            border-radius: 8px;

            text-decoration: none;
            font-weight: bold;
        }

        .cadastro {
            background-color: #0f766e;
            color: white;
        }

        .cadastro:hover {
            background-color: #0d5f59;
        }

        .entrar {
            background-color: #dff7f5;
            color: #0f766e;
            border: 1px solid #0f766e;
        }

        .entrar:hover {
            background-color: #c9efeb;
        }

        footer {
            color: #666;
            font-size: 13px;
            padding: 20px;
        }

        @media (max-width: 600px) {

            .content {
                padding: 30px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .button {
                display: block;
                margin: 10px 0;
            }
        }

    </style>
</head>

<body>

    <header>
        <div class="logo">
            🐾 PetShop
        </div>
    </header>


    <div class="container">

        <div class="content">

            <div class="text">

                <h1>Cuide do seu melhor amigo!</h1>
                <p>Cadastre seu pet e tenha suas informações organizadas de forma simples e prática.</p>

                <div class="buttons">
                    <a href="cadastro.html" class="button cadastro">Cadastrar Pet</a>
                    <a href="index.html" class="button entrar">Entrar</a>
                </div>

            </div>

            <img src="pata.png" alt="pata" class="imagem">
        </div>

    </div>

    <script>

        const botoes =
            document.querySelectorAll(".button");

        botoes.forEach(function(botao) {

            botao.addEventListener("click", function() {

                console.log(
                    "Acessando:",
                    botao.textContent.trim()
                );

            });

        });

    </script>

</body>

</html>
